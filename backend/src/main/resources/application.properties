# Load local environment values from backend/.env when present.
spring.config.import=optional:file:./.env[.properties]

# Server Configuration
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Fitnexus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:change_me_before_running_in_production}
jwt.expiration=86400000

# Default Super Admin bootstrap values
super-admin.email=${SUPER_ADMIN_EMAIL:admin@fitnexus.test}
super-admin.email-2=${SUPER_ADMIN_SECONDARY_EMAIL:admin@gmail.com}
super-admin.password=${SUPER_ADMIN_PASSWORD:Admin@123}
super-admin.first-name=${SUPER_ADMIN_FIRST_NAME:Admin}
super-admin.last-name=${SUPER_ADMIN_LAST_NAME:}

# Logging
logging.level.root=INFO
logging.level.com.fitnexus.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
