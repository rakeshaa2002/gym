# Load local environment values from backend/.env when present.
spring.config.import=optional:file:./.env[.properties]

# Server Configuration
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Fitnexus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JWT Configuration
jwt.secret=${JWT_SECRET:change_me_before_running_in_production}
jwt.expiration=86400000

# Default Super Admin bootstrap values
super-admin.email=${SUPER_ADMIN_EMAIL:admin@fitnexus.test}
super-admin.email-2=${SUPER_ADMIN_SECONDARY_EMAIL:admin@gmail.com}
super-admin.password=${SUPER_ADMIN_PASSWORD:Admin@123}
super-admin.first-name=${SUPER_ADMIN_FIRST_NAME:Admin}
super-admin.last-name=${SUPER_ADMIN_LAST_NAME:}

# Shared secret the fingerprint terminal must send in the X-Device-Key header
attendance.device-key=${ATTENDANCE_DEVICE_KEY:fitnexus-device-key-2026}

# Razorpay (keys come from backend/.env, which is gitignored)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
membership.premium-price=${MEMBERSHIP_PREMIUM_PRICE:999}

# Email / SMTP (fill these in backend/.env). If host is blank, OTPs are logged instead of emailed (demo mode).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@fitnexus.test}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

# WebRTC STUN/TURN servers (real-time audio/video calling)
# Leave TURN blank to use only Google's public STUN (works on most networks).
# For a production TURN server, try https://www.metered.ca/turn or self-host coturn.
webrtc.stun.server=${WEBRTC_STUN_SERVER:stun:stun.l.google.com:19302}
webrtc.turn.url=${WEBRTC_TURN_URL:}
webrtc.turn.username=${WEBRTC_TURN_USERNAME:}
webrtc.turn.credential=${WEBRTC_TURN_CREDENTIAL:}

# Logging
logging.level.root=INFO
logging.level.com.fitnexus.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
